{% extends "dashboard/base.html" %}
{% block heading %}Confirm Delete{% endblock %}
{% block content %}
<section class="dash-panel">
  <h2>Delete "{{ object }}"?</h2>
  <p>This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url cancel_url %}">Cancel</a>
  </form>
</section>
{% endblock %}
